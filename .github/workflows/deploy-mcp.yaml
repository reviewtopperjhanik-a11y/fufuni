name: FufuniMCPDeploy

on:
  push:
    branches:
      - main
    paths:
      - apps/mcp/**
      - mcp/**
      - package-lock.json
      - .github/workflows/deploy-mcp.yaml
      - .github/workflows/create-env-artifact.yaml
      - scripts/generate-wrangler-jsonc.py
  schedule:
    # 1st and 15th of each month at midnight UTC
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  create-env:
    uses: ./.github/workflows/create-env-artifact.yaml
    secrets: inherit

  deploy:
    needs: create-env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm install

      - name: Download shared .env artifact
        uses: actions/download-artifact@v5
        with:
          name: shared-env
          path: .

      # .env.enc was encrypted with openssl enc -aes-256-cbc -salt -in env_and_wrangler.tar.gz -out .env.enc -iter 10000 -pass pass:"${{ secrets.CRYPTOKEN }}"
      - name: Decrypt .env + wrangler.jsonc artifact
        run: |
          openssl enc -aes-256-cbc -d -salt -in .env.enc -out env_and_wrangler.tar.gz -iter 10000 -pass pass:"${{ secrets.CRYPTOKEN }}"
          tar -xzvf env_and_wrangler.tar.gz
          rm env_and_wrangler.tar.gz .env.enc
          if [ ! -f apps/mcp/wrangler.jsonc ]; then
            echo "Decrypted artifact does not contain apps/mcp/wrangler.jsonc"
            exit 1
          fi
          if [ ! -f apps/mcp/secrets.json ]; then
            echo "Decrypted artifact does not contain apps/mcp/secrets.json"
            exit 1
          fi

      - name: build auto-generated source for MCP Worker
        run: |
          source .env
          rm -f apps/mcp/src/config/ai.json.enc
          cp ai.json.enc apps/mcp/src/config/ai.json.enc
          source .env && cd apps/merchant && npm run gen:openapi && cd ../..
          source .env && cd apps/mcp && npm run gen-knowledge && cd ../..
          source .env && cd apps/mcp && npm run build:sources && cd ../..
          source .env && npm run mcp:manifest:build
          source .env && npm run mcp:bm25-index:build
        env:
          CRYPTOKEN: ${{ secrets.CRYPTOKEN }}
          CLOUDFLARE_AIG_TOKEN: ${{ secrets.CLOUDFLARE_AIG_TOKEN }}

      - name: Set Wrangler secrets in bulk from secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRYPTOKEN: ${{ secrets.CRYPTOKEN }}
        run: |
          cd apps/mcp
          npx wrangler secret bulk < secrets.json

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRYPTOKEN: ${{ secrets.CRYPTOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp

      - name: Publish stdio build to npm
        run : |
          # Note for ci/cd to work you need to go to https://www.npmjs.com/package/@sctg/fufuni-mcp/access and set "Trusted publisher to Github Actions"
          cd apps/mcp
          # Path the version "0\.1\.0-beta\..*"" to a version like "0.1.0-beta.20260426" in package.json, then build stdio and publish to npm
          export DATE=$(date +%Y%m%d)
          #check if the same version already exists on npm, if so add the 8 first chars of the git sha to the version to make it unique, e.g. "0.1.0-beta.20260426-1a2b3c4d"
          if npm view @sctg/fufuni-mcp@0.1.0-beta.${DATE} > /dev/null 2>&1; then
            export DATE="${DATE}-$(git rev-parse --short HEAD)"
          fi
          sed -i "s/\"0\.1\.0-beta\..*\"/\"0.1.0-beta.${DATE}\"/" package.json
          npm run build:stdio:esm
          npm publish --access public --tag beta